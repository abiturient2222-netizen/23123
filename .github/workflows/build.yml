name: Build Forge Mod 1.16.5
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate Project Files
        run: |
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/java/com/commandbinder/mod
          
          cat << 'EOF' > settings.gradle
          rootProject.name = 'CommandBinder'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  maven { url = 'https://maven.minecraftforge.net' }
                  mavenCentral()
              }
              dependencies {
                  classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
              }
          }
          apply plugin: 'net.minecraftforge.gradle'

          version = '1.0.0'
          group = 'com.commandbinder.mod'
          archivesBaseName = 'CommandBinder-1.16.5'

          java.toolchain.languageVersion = JavaLanguageVersion.of(8)

          minecraft {
              mappings channel: 'official', version: '1.16.5'
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[36,)"
          license="MIT"

          [[mods]]
          modId="commandbinder"
          version="1.0.0"
          displayName="Command Binder Mod"
          authors="Developer"
          description="Биндер команд для 1.16.5"

          [[dependencies.commandbinder]]
              modId="forge"
              mandatory=true
              versionRange="[36.2.0,)"
              ordering="NONE"
              side="BOTH"
          EOF

          cat << 'EOF' > src/main/java/com/commandbinder/mod/CommandBinderMod.java
          package com.commandbinder.mod;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.settings.KeyBinding;
          import net.minecraft.client.util.InputMappings;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.InputEvent;
          import net.minecraftforge.client.settings.KeyConflictContext;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.client.registry.ClientRegistry;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.event.lifecycle.FMLClientSetupEvent;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import org.lwjgl.glfw.GLFW;

          @Mod("commandbinder")
          public class CommandBinderMod {
              public static KeyBinding keyGm1;
              public static KeyBinding keyGm0;
              public static KeyBinding keySpawn;

              public CommandBinderMod() {
                  FMLJavaModLoadingContext.get().getModEventBus().addListener(this::setup);
                  MinecraftForge.EVENT_BUS.register(this);
              }

              private void setup(final FMLClientSetupEvent event) {
                  keyGm1 = new KeyBinding("GM 1 (Creative)", KeyConflictContext.IN_GAME, GLFW.GLFW_KEY_G, "Command Binder");
                  keyGm0 = new KeyBinding("GM 0 (Survival)", KeyConflictContext.IN_GAME, GLFW.GLFW_KEY_H, "Command Binder");
                  keySpawn = new KeyBinding("Spawn", KeyConflictContext.IN_GAME, GLFW.GLFW_KEY_J, "Command Binder");
                  
                  ClientRegistry.registerKeyBinding(keyGm1);
                  ClientRegistry.registerKeyBinding(keyGm0);
                  ClientRegistry.registerKeyBinding(keySpawn);
              }

              @Mod.EventBusSubscriber(modid = "commandbinder", value = Dist.CLIENT)
              public static class ClientHandler {
                  @SubscribeEvent
                  public static void onKey(InputEvent.KeyInputEvent event) {
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.player == null) return;

                      if (keyGm1.consumeClick()) mc.player.chat("/gamemode creative");
                      if (keyGm0.consumeClick()) mc.player.chat("/gamemode survival");
                      if (keySpawn.consumeClick()) mc.player.chat("/spawn");
                  }
              }
          }
          EOF

      - name: Setup Gradle
        run: gradle wrapper --gradle-version 7.4.2

      - name: Build Mod
        run: ./gradlew build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommandBinder-Mod-Final
          path: build/libs/*.jar
