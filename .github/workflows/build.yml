name: Build Command Binder Mod 1.16.5
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate Mod Files
        run: |
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/java/com/commandbinder/mod
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'CommandBinder'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  maven { url = 'https://maven.minecraftforge.net' }
                  mavenCentral()
              }
              dependencies {
                  classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
              }
          }
          apply plugin: 'net.minecraftforge.gradle'

          version = '1.0.0'
          group = 'com.commandbinder.mod'
          archivesBaseName = 'CommandBinder-1.16.5'

          java.toolchain.languageVersion = JavaLanguageVersion.of(8)

          minecraft {
              mappings channel: 'official', version: '1.16.5'
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[36,)"
          issueTrackerURL="https://github.com"
          license="MIT"

          [[mods]]
          modId="commandbinder"
          version="1.0.0"
          displayName="Command Binder Mod"
          authors="Developer"
          description="Mod for binding custom Minecraft commands to keybinds."

          [[dependencies.commandbinder]]
              modId="forge"
              mandatory=true
              versionRange="[36.2.0,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.commandbinder]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.16.5]"
              ordering="NONE"
              side="BOTH"
          EOF

          cat << 'EOF' > src/main/java/com/commandbinder/mod/CommandBinderMod.java
          package com.commandbinder.mod;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.settings.KeyBinding;
          import net.minecraft.client.util.InputMappings;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.InputEvent;
          import net.minecraftforge.client.settings.KeyConflictContext;
          import net.minecraftforge.common.ForgeConfigSpec;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.ModLoadingContext;
          import net.minecraftforge.fml.client.registry.ClientRegistry;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.config.ModConfig;
          import net.minecraftforge.fml.event.lifecycle.FMLClientSetupEvent;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import org.lwjgl.glfw.GLFW;

          @Mod("commandbinder")
          public class CommandBinderMod {

              public static final String MOD_ID = "commandbinder";

              public static KeyBinding key1;
              public static KeyBinding key2;
              public static KeyBinding key3;
              public static KeyBinding key4;
              public static KeyBinding key5;

              public CommandBinderMod() {
                  ModLoadingContext.get().registerConfig(ModConfig.Type.CLIENT, Config.SPEC);
                  FMLJavaModLoadingContext.get().getModEventBus().addListener(this::onClientSetup);
                  MinecraftForge.EVENT_BUS.register(this);
              }

              private void onClientSetup(final FMLClientSetupEvent event) {
                  String category = "Command Binder";

                  key1 = new KeyBinding("Бинд 1 (/gamemode creative)", KeyConflictContext.IN_GAME, InputMappings.Type.KEYSYM, GLFW.GLFW_KEY_G, category);
                  key2 = new KeyBinding("Бинд 2 (/gamemode survival)", KeyConflictContext.IN_GAME, InputMappings.Type.KEYSYM, GLFW.GLFW_KEY_H, category);
                  key3 = new KeyBinding("Бинд 3 (/spawn)", KeyConflictContext.IN_GAME, InputMappings.Type.KEYSYM, GLFW.GLFW_KEY_J, category);
                  key4 = new KeyBinding("Бинд 4 (/heal)", KeyConflictContext.IN_GAME, InputMappings.Type.KEYSYM, GLFW.GLFW_KEY_K, category);
                  key5 = new KeyBinding("Бинд 5 (/fly)", KeyConflictContext.IN_GAME, InputMappings.Type.KEYSYM, GLFW.GLFW_KEY_B, category);

                  ClientRegistry.registerKeyBinding(key1);
                  ClientRegistry.registerKeyBinding(key2);
                  ClientRegistry.registerKeyBinding(key3);
                  ClientRegistry.registerKeyBinding(key4);
                  ClientRegistry.registerKeyBinding(key5);
              }

              @Mod.EventBusSubscriber(modid = MOD_ID, value = Dist.CLIENT)
              public static class ClientEvents {

                  @SubscribeEvent
                  public static void onKeyInput(InputEvent.KeyInputEvent event) {
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.player == null) return;

                      if (key1 != null && key1.consumeClick()) {
                          executeCommand(Config.KEY1_COMMAND.get());
                      }
                      if (key2 != null && key2.consumeClick()) {
                          executeCommand(Config.KEY2_COMMAND.get());
                      }
                      if (key3 != null && key3.consumeClick()) {
                          executeCommand(Config.KEY3_COMMAND.get());
                      }
                      if (key4 != null && key4.consumeClick()) {
                          executeCommand(Config.KEY4_COMMAND.get());
                      }
                      if (key5 != null && key5.consumeClick()) {
                          executeCommand(Config.KEY5_COMMAND.get());
                      }
                  }

                  private static void executeCommand(String command) {
                      Minecraft mc = Minecraft.getInstance();
                      if (mc.player != null && command != null && !command.trim().isEmpty()) {
                          mc.player.chat(command);
                      }
                  }
              }

              public static class Config {
                  public static final ForgeConfigSpec.Builder BUILDER = new ForgeConfigSpec.Builder();
                  public static final ForgeConfigSpec SPEC;

                  public static final ForgeConfigSpec.ConfigValue<String> KEY1_COMMAND;
                  public static final ForgeConfigSpec.ConfigValue<String> KEY2_COMMAND;
                  public static final ForgeConfigSpec.ConfigValue<String> KEY3_COMMAND;
                  public static final ForgeConfigSpec.ConfigValue<String> KEY4_COMMAND;
                  public static final ForgeConfigSpec.ConfigValue<String> KEY5_COMMAND;

                  static {
                      BUILDER.push("Command Binder Configuration");

                      KEY1_COMMAND = BUILDER.comment("Команда для Блинда 1")
                              .define("key1_command", "/gamemode creative");

                      KEY2_COMMAND = BUILDER.comment("Команда для Блинда 2")
                              .define("key2_command", "/gamemode survival");

                      KEY3_COMMAND = BUILDER.comment("Команда для Блинда 3")
                              .define("key3_command", "/spawn");

                      KEY4_COMMAND = BUILDER.comment("Команда для Блинда 4")
                              .define("key4_command", "/heal");

                      KEY5_COMMAND = BUILDER.comment("Команда для Блинда 5")
                              .define("key5_command", "/fly");

                      BUILDER.pop();
                      SPEC = BUILDER.build();
                  }
              }
          }
          EOF

          - name: Setup Gradle Wrapper
            run: gradle wrapper --gradle-version 7.4.2

          - name: Build Mod
            run: ./gradlew build --no-daemon

          - name: Upload Mod JAR
            uses: actions/upload-artifact@v4
            with:
              name: CommandBinder-Mod-1.16.5
              path: build/libs/*.jar
